<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Ledger — GTA VI trophy guide and tracker</title>
<meta name="description" content="An offline guide and progress tracker for all 55 PlayStation 5 trophies of Grand Theft Auto VI.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><span class="sun"></span><span class="haze"></span></div>

<header id="topbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3l3.4 7.3 7.9.9-5.9 5.3 1.6 7.8L16 20.5 9 24.3l1.6-7.8L4.7 11.2l7.9-.9z"/>
    </svg>
    <div class="brand-text">
      <h1>Leonida Ledger</h1>
      <p class="tagline">Grand Theft Auto VI · PlayStation 5 · 55 trophies, one ledger</p>
    </div>
  </div>

  <div class="progress-block">
    <div class="ring" id="ring" aria-hidden="true"></div>
    <div class="progress-copy">
      <p class="progress-numbers"><strong id="progress-fraction">0 / 55</strong> <span id="progress-pct">0%</span></p>
      <p class="progress-caption" id="progress-caption">trophies earned</p>
      <div class="bar"><i id="bar-fill"></i></div>
    </div>
  </div>
</header>

<section id="controls">
  <div class="tabs" role="tablist">
    <button class="tab" data-view="tracker" role="tab" aria-selected="true">Tracker</button>
    <button class="tab" data-view="roadmap" role="tab" aria-selected="false">Roadmap</button>
  </div>

  <nav id="filters" aria-label="Filter trophies by kind"></nav>

  <label class="search">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
    <input id="search" type="search" placeholder="Search trophies" autocomplete="off" spellcheck="false">
  </label>

  <button id="spoiler-toggle" class="toggle" type="button" aria-pressed="true">
    <span class="switch" aria-hidden="true"><i></i></span>
    <span class="toggle-label">Spoiler guard <b id="spoiler-state">on</b></span>
  </button>

  <div class="io">
    <button id="export" class="ghost" type="button" title="Save progress to a JSON file">Export</button>
    <label class="ghost import">Import<input id="import" type="file" accept="application/json,.json" hidden></label>
  </div>
</section>

<main id="stage">
  <div class="view" id="view-tracker">
    <aside id="list-pane" aria-label="Trophy list"><div id="groups"></div></aside>
    <section id="detail-pane" aria-label="Trophy guide"><article id="detail"></article></section>
  </div>
  <div class="view" id="view-roadmap" hidden><div id="roadmap"></div></div>
</main>

<footer id="statusbar">
  <span id="status-left"></span>
  <span id="status-right">Progress saves in this browser · localStorage</span>
</footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
